name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore
        run: dotnet restore OakIdeas.Aspire.DataExplorer.sln

      - name: Build
        run: dotnet build OakIdeas.Aspire.DataExplorer.sln --configuration Release --no-restore

      - name: Format check
        run: dotnet format OakIdeas.Aspire.DataExplorer.sln --verify-no-changes

      - name: Test
        run: dotnet test OakIdeas.Aspire.DataExplorer.sln --configuration Release --no-build
